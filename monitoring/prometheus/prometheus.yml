global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'cardano-node'
    static_configs:
      - targets: ['cardano-node:12798']

  - job_name: 'node_exporter_srv'
    dns_sd_configs:
      - names:
          - '_node-exporter._tcp.internal.mesh'
        type: 'SRV'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance
        replacement: '$1'
        action: replace
      - source_labels: [__meta_dns_name]
        target_label: dns_name
        action: replace
